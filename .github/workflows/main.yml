name: Deploy boarding

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        run: git clone https://github.com/nguyen-tien-thanh/boarding.git

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use
          docker buildx inspect --bootstrap

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Print working directory
        run: |
          pwd
          ls

      - name: Build and Push Docker image
        run: |
          cd boarding
          docker compose -f docker-compose.live.yml build boarding
          docker compose -f docker-compose.live.yml push boarding

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to server
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" \
          ssh -o StrictHostKeyChecking=no \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
          "cd docker/371 && \
          docker-compose stop boarding && \
          docker-compose pull boarding && \
          docker-compose up -d boarding" 