version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: boarding_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boarding
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - boarding_network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: boarding_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5673:5672'
      - '15673:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - boarding_network

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  boarding_network:
    driver: bridge
